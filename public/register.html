<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14b8a6"><title>Créer un compte | OMNIPAY</title><style>:root{--bg:#050b16;--panel:#0d1829;--text:#f8fafc;--muted:#94a3b8;--line:rgba(148,163,184,.18);--teal:#14b8a6;--cyan:#5eead4;--green:#22c55e;--amber:#f59e0b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 0%,rgba(20,184,166,.22),transparent 34%),var(--bg)}.card{width:min(620px,100%);padding:28px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,#12223a,#091321);box-shadow:0 24px 70px rgba(0,0,0,.3)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.logo{display:grid;place-items:center;width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,#99f6e4,var(--teal));color:#022c2a;font-weight:950;font-size:24px}.brand h1{margin:0;font-size:22px}.muted{color:var(--muted)}.small{font-size:13px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.step{padding:10px;border:1px solid var(--line);border-radius:12px;text-align:center;color:var(--muted);font-size:12px}.step.active{color:var(--cyan);border-color:rgba(20,184,166,.45);background:rgba(20,184,166,.1)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-top:14px}.field label{display:block;margin-bottom:7px;font-size:13px;font-weight:750}.field input{width:100%;padding:14px;border:1px solid #334155;border-radius:14px;outline:none;color:var(--text);background:#07111f}.field input:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(20,184,166,.12)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.btn{min-height:48px;border:0;border-radius:14px;padding:13px;color:white;font-weight:850;cursor:pointer}.primary{background:linear-gradient(135deg,var(--teal),#0f8f84)}.secondary{background:#17263d;border:1px solid var(--line)}.btn:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none!important}.message{min-height:24px;margin-top:14px;color:var(--amber);font-size:13px}.success{margin-top:14px;padding:12px;border:1px solid rgba(34,197,94,.3);border-radius:13px;background:rgba(34,197,94,.1);color:#86efac}.back{display:inline-block;margin-top:18px;color:var(--cyan);text-decoration:none;font-size:13px;font-weight:750}@media(max-width:560px){.row,.actions,.steps{grid-template-columns:1fr}}</style></head><body><main class="card"><div class="brand"><div class="logo">O</div><div><h1>OMNIPAY</h1><div class="muted small">Création sécurisée du compte</div></div></div><div class="steps"><div id="step1" class="step active">1. Informations</div><div id="step2" class="step">2. Code OTP</div><div id="step3" class="step">3. Compte créé</div></div><form id="registerForm"><div class="row"><div class="field"><label for="firstName">Prénom</label><input id="firstName" autocomplete="given-name"></div><div class="field"><label for="lastName">Nom</label><input id="lastName" autocomplete="family-name"></div></div><div class="field"><label for="email">Adresse email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="phone">Téléphone</label><input id="phone" type="tel" autocomplete="tel" required></div><div class="field"><label for="password">Mot de passe</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="actions"><button id="requestOtpBtn" class="btn secondary" type="button">Recevoir le code OTP</button><button id="verifyOtpBtn" class="btn secondary" type="button" disabled>Vérifier le code</button></div><div id="otpField" class="field hidden"><label for="otpCode">Code OTP à 6 chiffres</label><input id="otpCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"></div><div id="verifiedBox" class="success hidden">Email vérifié. Vous pouvez créer votre compte.</div><button id="createBtn" class="btn primary" style="width:100%;margin-top:16px" type="submit" disabled>Créer mon compte</button><div id="message" class="message" aria-live="polite"></div></form><a class="back" href="/dashboard-v2.html">Retour à la connexion</a></main><script src="/register-otp.js"></script></body></html>
