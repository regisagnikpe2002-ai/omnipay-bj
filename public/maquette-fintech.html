<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, 
initial-scale=1"
  >

  <title>OMNIPAY 2.0</title>

  <style>
    :root {
      --background: #07101f;
      --surface: #101b2d;
      --surface-light: #17243a;
      --primary: #14b8a6;
      --secondary: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --white: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(148, 163, 184, 
0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--white);
      background:
        radial-gradient(
          circle at 10% 0%,
          rgba(20, 184, 166, 0.18),
          transparent 35%
        ),
        radial-gradient(
          circle at 100% 30%,
          rgba(59, 130, 246, 0.18),
          transparent 30%
        ),
        var(--background);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .hidden {
      display: none !important;
    }

    .shell {
      width: min(100%, 1120px);
      margin: 0 auto;
      padding: 22px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: 
space-between;
      gap: 18px;
      padding: 8px 0 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border-radius: 16px;
      color: #052e2b;
      background:
        linear-gradient(
          135deg,
          #5eead4,
          #14b8a6
        );
      box-shadow:
        0 12px 30px
        rgba(20, 184, 166, 0.28);
      font-size: 22px;
      font-weight: 900;
    }

    .brand-name {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .brand-tagline {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .backend-status {
      padding: 9px 13px;
      border: 1px solid 
var(--border);
      border-radius: 999px;
      color: var(--muted);
      background:
        rgba(15, 23, 42, 0.72);
      font-size: 13px;
    }

    .hero {
      display: grid;
      grid-template-columns:
        minmax(0, 1.2fr)
        minmax(280px, 0.8fr);
      gap: 20px;
      align-items: stretch;
    }

    .panel {
      border: 1px solid 
var(--border);
      border-radius: 26px;
      background:
        linear-gradient(
          145deg,
          rgba(23, 36, 58, 0.96),
          rgba(15, 27, 46, 0.96)
        );
      box-shadow:
        0 24px 70px
        rgba(0, 0, 0, 0.26);
    }

      padding: 34px;
    }
